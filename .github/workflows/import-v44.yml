name: Verify and publish v4.4 session analytics review branch
on:
  push:
    branches: [transfer/v44-verified-sessions]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source transfer
        run: |
          cp .github/import-v44/apply.py "$RUNNER_TEMP/aureon-v44-apply.py"
          python3 "$RUNNER_TEMP/aureon-v44-apply.py" decode .github/import-v44 "$RUNNER_TEMP/aureon-v44.patch"
      - name: Reconstruct and validate exact implementation tree
        run: |
          set -euo pipefail
          git checkout --detach e856aa5a0cd8cffc85e24a713cba5f6bec9a9378
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 "$RUNNER_TEMP/aureon-v44-apply.py" apply "$RUNNER_TEMP/aureon-v44.patch" "$RUNNER_TEMP/identity.json" | tee "$RUNNER_TEMP/validation.log"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = e856aa5a0cd8cffc85e24a713cba5f6bec9a9378
          git push origin HEAD:refs/heads/feature/v4.4-session-analytics
          git archive --format=zip HEAD > "$RUNNER_TEMP/source.zip"
          git log -1 --format='%H %s' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aureon-v44-verified-source
          path: |
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/identity.json
            ${{ runner.temp }}/validation.log
          retention-days: 14
