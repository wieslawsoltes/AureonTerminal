name: Export renderer review source
on:
  push:
    branches: [transfer/renderer-review-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 30947d2bd7c4e28cfe60f0bd8f73efb6816efae1
      - name: Export exact merged source and preserved fragments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aureon-review"
          git branch review-source HEAD
          git bundle create "$RUNNER_TEMP/aureon-review/source.bundle" review-source
          git archive --format=zip -o "$RUNNER_TEMP/aureon-review/source.zip" HEAD
          for sha in 8f9cef27969659e467f745d31b7b75ff6d10ae15 690c3bc8e905ab4a98562ab255ea717d03487096; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode > "$RUNNER_TEMP/aureon-review/$sha.b64"
          done
          cd "$RUNNER_TEMP/aureon-review"
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aureon-renderer-review-source
          path: ${{ runner.temp }}/aureon-review/
          retention-days: 14
