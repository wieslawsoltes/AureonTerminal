name: Diagnose actual WebGPU canvas presentation
on:
  push:
    branches: [transfer/v43-adapter-diagnostics]
permissions:
  contents: read
jobs:
  diagnostics:
    strategy:
      fail-fast: false
      matrix:
        presentation: [idle-headless, raf-headless, idle-headed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2db0ab0216f1a5be7bc3e8455263d2c57fd292b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            with open(os.environ['GITHUB_ENV'],'a') as out:out.write('CHROMIUM='+p.chromium.executable_path+'\n')
          PY
      - name: Check identical pixels with explicit scheduling and native stderr
        env:
          PRESENTATION: ${{ matrix.presentation }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('scripts/verify-browser-v43.py');s=p.read_text()
          s=s.replace("png=await page.locator('#gpu-presentation-fixture').screenshot()", "await asyncio.sleep(1)\n                        print('FIXTURE',await page.evaluate('()=>{const x=rendererPresentationFixture,c=x.canvas,s=getComputedStyle(c);return{diagnostics:x.r.diagnostics(),rect:c.getBoundingClientRect().toJSON(),css:s.cssText,display:s.display,visibility:s.visibility,opacity:s.opacity,z:s.zIndex,hidden:c.hidden,top:document.elementFromPoint(16,16)?.id,body:document.body.lastElementChild===c};}'),flush=True)\n                        png=await page.locator('#gpu-presentation-fixture').screenshot()")
          if os.environ['PRESENTATION']=='raf-headless':
            s=s.replace('r.render(g,rgba(\'#000000\'));', "r.render(g,rgba('#000000'));const tick=()=>{if(!r.destroyed){r.render(g,rgba('#000000'));requestAnimationFrame(tick);}};requestAnimationFrame(tick);")
          if os.environ['PRESENTATION']=='idle-headed':s=s.replace('headless=True','headless=False')
          p.write_text(s)
          PY
          mkdir -p verification/v4/renderer
          DEBUG=pw:browser xvfb-run -a python scripts/verify-browser-v43.py 2>verification/v4/renderer/browser-stderr.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aureon-v43-presentation-${{ matrix.presentation }}
          path: verification/v4/renderer/
          retention-days: 14
