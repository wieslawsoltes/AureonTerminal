name: Export committed source for v4 development
on:
  push:
    branches: [transfer/v4-snapshot]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz 01853284786388922cb475245e7c030b55f17e42 > /tmp/aureon-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: aureon-v3-source
          path: /tmp/aureon-source.tar.gz
          retention-days: 1
