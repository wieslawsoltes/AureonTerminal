name: Verify SwiftShader compositor configurations
on:
  push:
    branches: [transfer/v43-adapter-diagnostics]
permissions:
  contents: read
jobs:
  diagnostics:
    strategy:
      fail-fast: false
      matrix:
        compositor: [default-headless, angle-headless, default-headed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62fcd4b7d9c273f638ef5a122e1a65f602448056
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and permitted virtual display
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            with open(os.environ['GITHUB_ENV'],'a') as out:out.write('CHROMIUM='+p.chromium.executable_path+'\n')
          PY
      - name: Test unchanged device and pixel assertions with explicit compositor mode
        env:
          COMPOSITOR: ${{ matrix.compositor }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('scripts/verify-browser-v43.py');s=p.read_text()
          start=s.index('GPU_FLAGS=');end=s.index('\n',start)
          flags=['--enable-unsafe-webgpu','--use-webgpu-adapter=swiftshader']
          if os.environ['COMPOSITOR']=='angle-headless':flags+=['--use-angle=swiftshader','--enable-unsafe-swiftshader']
          s=s[:start]+'GPU_FLAGS='+repr(flags)+s[end:]
          if os.environ['COMPOSITOR']=='default-headed':s=s.replace('headless=True','headless=False')
          p.write_text(s)
          PY
          mkdir -p verification/v4/renderer
          DEBUG=pw:browser xvfb-run -a python scripts/verify-browser-v43.py 2>verification/v4/renderer/browser-stderr.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aureon-v43-compositor-${{ matrix.compositor }}
          path: verification/v4/renderer/
          retention-days: 14
