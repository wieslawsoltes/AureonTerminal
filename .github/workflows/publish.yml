name: Validate and publish Aureon Terminal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aureon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source and build static client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone client
        run: npm run build
      - name: Independent product reference guard
        run: npm run references
      - name: Syntax checks and automated tests
        run: npm run check
      - name: Verify committed standalone distribution
        run: git diff --exit-code -- dist/AureonTerminal.html
      - name: Prepare static-only Pages artifact
        run: |
          mkdir -p _site
          cp dist/AureonTerminal.html _site/index.html
          cp dist/AureonTerminal.html _site/AureonTerminal.html
          cp icon.svg manifest.webmanifest sw.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: aureon-terminal-pr-${{ github.event.number }}
          path: _site
          retention-days: 14

  deploy:
    name: Deploy default branch to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy static client
        id: deployment
        uses: actions/deploy-pages@v4
